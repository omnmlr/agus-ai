plugins {
    id 'com.android.application'
}

def signing = ['AGUS_ANDROID_KEYSTORE_FILE', 'AGUS_ANDROID_KEYSTORE_PASSWORD', 'AGUS_ANDROID_KEY_ALIAS',
               'AGUS_ANDROID_KEY_PASSWORD'].collect { System.getenv(it) }
if (signing.any { it } && !signing.every { it }) {
    throw new GradleException('Set all four AGUS Android release signing environment variables')
}

android {
    namespace 'app.agus.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'app.agus.companion'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    if (signing.every { it }) {
        signingConfigs {
            release {
                storeFile file(signing[0])
                storePassword signing[1]
                keyAlias signing[2]
                keyPassword signing[3]
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib:2.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
