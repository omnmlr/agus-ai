pluginManagement {
    repositories {
        google()
        if (providers.environmentVariable('AGUS_ANDROID_CENTRAL_MIRROR').orNull == '1') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
        } else {
            mavenCentral()
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        if (providers.environmentVariable('AGUS_ANDROID_CENTRAL_MIRROR').orNull == '1') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
        } else {
            mavenCentral()
        }
    }
}

rootProject.name = 'AGUSCompanion'
include ':app'
