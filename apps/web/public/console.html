<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121611">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <title>Developer console · AGUS AI</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./console.mjs"></script>
</head>
<body class="console-page" data-mode="guest">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="console-header">
    <a class="brand" href="/" aria-label="AGUS AI home"><img src="/assets/mark.svg" width="28" height="28" alt="">AGUS <span class="brand-prefix">AI</span></a>
    <p>Developer console</p>
    <a class="console-docs" href="/docs">Documentation <span aria-hidden="true">↗</span></a>
    <div id="account"></div>
  </header>
  <div class="console-frame">
    <nav class="console-nav" aria-label="Console" id="navigation"></nav>
    <main id="main" class="console-main" tabindex="-1">
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="screen"><p>Opening the developer console…</p></div>
    </main>
  </div>
  <noscript><p class="wrap">JavaScript is required to use the developer console.</p></noscript>
</body>
</html>
