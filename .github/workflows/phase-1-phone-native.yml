name: Phase 1 phone-native feasibility

on:
  workflow_dispatch:
  push:
    branches: [research/phase-1-phone-native]
    paths:
      - 'experiments/phone-native/**'
      - '.github/workflows/phase-1-phone-native.yml'

permissions:
  contents: read

jobs:
  profile-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare a clean emulator and exercise the app
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/agus-phase1"
          mkdir -p "$output"
          sudo chown "$USER" /dev/kvm
          npm ci --prefix services/control-plane --no-audit --no-fund
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$sdkmanager" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;default;x86_64"
          export ANDROID_AVD_HOME="$output/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd -n agus_phase1 -k 'system-images;android-35;default;x86_64'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd agus_phase1 -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 3072 > "$output/emulator.log" 2>&1 &
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          timeout 250 bash -c 'adb -s emulator-5554 wait-for-device; until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          bash experiments/phone-native/run-lab.sh "$output"
      - name: Retain sanitized fixture observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-1-phone-native-observations
          path: |
            ${{ runner.temp }}/agus-phase1/checks.json
            ${{ runner.temp }}/agus-phase1/markers.log
            ${{ runner.temp }}/agus-phase1/last-ui.xml
            ${{ runner.temp }}/agus-phase1/build.log
            ${{ runner.temp }}/agus-phase1/emulator.log
            ${{ runner.temp }}/agus-phase1/revision.txt
            ${{ runner.temp }}/agus-phase1/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
