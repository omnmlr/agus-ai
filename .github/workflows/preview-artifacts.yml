name: AGUS AI preview artifacts

on:
  workflow_dispatch:
  push:
    branches: [feature/phase-2-3-product, release/hackathon-integrated]
    paths: ['.github/workflows/preview-artifacts.yml', 'scripts/product-preview/package.sh', 'apps/android/app/**', 'apps/android/native-preview/**', 'deploy/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Assemble backend and Android preview files
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/agus-preview"

          npm ci --prefix services/control-plane --omit=dev --no-audit --no-fund
          npm ci --prefix services/settlement --omit=dev --no-audit --no-fund
          npm ci --prefix deploy/neon --no-audit --no-fund
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          bash scripts/product-preview/package.sh "$artifacts"

      - name: Publish preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agus-ai-hackathon-preview
          path: ${{ runner.temp }}/agus-preview/
          if-no-files-found: error
          retention-days: 60

  settlement-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build and verify isolated AMD64 images
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/package.sh HEAD "$RUNNER_TEMP"
          release="$RUNNER_TEMP/agus-ai-$(git rev-parse HEAD)"
          (cd "$release" && sha256sum --check --strict SHA256SUMS.txt)
          mkdir "$RUNNER_TEMP/agus-settlement-upload"
          tar -czf "$RUNNER_TEMP/agus-settlement-upload/agus-settlement-linux-amd64.tar.gz" -C "$release" .
          (cd "$RUNNER_TEMP/agus-settlement-upload" && sha256sum agus-settlement-linux-amd64.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agus-ai-settlement-linux-amd64
          path: ${{ runner.temp }}/agus-settlement-upload
          if-no-files-found: error
          retention-days: 60
