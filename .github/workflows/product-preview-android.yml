name: AGUS product preview on Android

on:
  workflow_dispatch:
  push:
    branches: [feature/phase-2-3-product]
    paths:
      - 'apps/android/native-preview/**'
      - 'packages/cooperative-android/**'
      - 'scripts/product-preview/**'
      - 'services/control-plane/src/**'
      - '.github/workflows/product-preview-android.yml'

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and exercise signed preview on Android
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agus-product-preview"
          mkdir -p "$out"
          sudo chown "$USER" /dev/kvm
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$sdkmanager" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;default;x86_64"
          npm ci --prefix services/control-plane --no-audit --no-fund
          bash apps/android/native-preview/build.sh "$out"
          git rev-parse HEAD > "$out/revision.txt"
          export ANDROID_AVD_HOME="$out/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd -n agus_preview -k 'system-images;android-35;default;x86_64'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd agus_preview -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 3072 > "$out/emulator.log" 2>&1 &
          node scripts/product-preview/fixtures.mjs "$out" serve > "$out/backend.log" 2>&1 &
          backend=$!
          trap 'kill "$backend" || true; adb -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          curl -sf --retry 5 --retry-delay 1 --retry-connrefused http://127.0.0.1:18765/health
          node scripts/product-preview/fixtures.mjs "$out" seed
          timeout 240 bash -c 'adb -s emulator-5554 wait-for-device; until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          python3 scripts/product-preview/android.py "$out"
          node scripts/product-preview/fixtures.mjs "$out" review
      - name: Retain sanitized preview observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agus-product-preview-observations
          path: |
            ${{ runner.temp }}/agus-product-preview/android-checks.json
            ${{ runner.temp }}/agus-product-preview/android-markers.log
            ${{ runner.temp }}/agus-product-preview/campaign-evidence.json
            ${{ runner.temp }}/agus-product-preview/emulator.log
            ${{ runner.temp }}/agus-product-preview/revision.txt
          if-no-files-found: warn
          retention-days: 14
